# NOTE:
# Strings are formatted by the translations plugin with fmt (C++) syntax.
# Arguments are positional and zero-based: {0}, {1}, ... - they may be reordered.
#
# Color tags must be escaped with double braces: {{red}}, {{default}}.
# A single brace is treated as an argument placeholder.
# Exception: strings translated without arguments (Translate) are not formatted,
# so their color tags use single braces: {red}, {default}.
#
# Detailed documentation about the format syntax:
# https://fmt.dev/latest/syntax/

